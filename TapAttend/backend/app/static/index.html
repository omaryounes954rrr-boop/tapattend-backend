<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TapAttend - لوحة التحكم الشاملة</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #0ea5e9;
      --text: #f8fafc;
      --muted: #94a3b8;
      --border: #334155;
      --danger: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg); color: var(--text); display: flex; min-height: 100vh; }
    
    /* Layout */
    .shell { display: flex; width: 100%; }
    .sidebar { width: 260px; background: #020617; border-left: 1px solid var(--border); padding: 1.5rem; display: flex; flex-direction: column; gap: 1rem; }
    .sidebar h2 { color: var(--accent); font-size: 1.5rem; }
    .nav-btn { background: transparent; border: none; color: var(--muted); text-align: right; padding: 0.75rem 1rem; border-radius: 8px; cursor: pointer; font-size: 1rem; transition: 0.2s; }
    .nav-btn:hover, .nav-btn.active { background: var(--card-bg); color: var(--text); }
    .main-content { flex: 1; padding: 2rem; overflow-y: auto; }
    
    /* UI Components */
    .cards-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1.5rem; margin-bottom: 2rem; }
    .card { background: var(--card-bg); border: 1px solid var(--border); padding: 1.5rem; border-radius: 12px; }
    .kpi { font-size: 2rem; font-weight: bold; color: var(--accent); margin-top: 0.5rem; }
    
    /* Form & Controls */
    .form-card { display: flex; flex-wrap: wrap; gap: 1rem; margin-bottom: 2rem; align-items: center; }
    input, select, button { padding: 0.75rem 1rem; border-radius: 8px; border: 1px solid var(--border); background: #0f172a; color: var(--text); font-size: 0.95rem; }
    input:focus, select:focus { outline: 1px solid var(--accent); }
    .btn { background: var(--accent); color: #fff; font-weight: bold; border: none; cursor: pointer; }
    .btn:hover { opacity: 0.9; }
    
    /* Table */
    table { width: 100%; border-collapse: collapse; margin-top: 1rem; background: var(--card-bg); border-radius: 12px; overflow: hidden; }
    th, td { padding: 1rem; text-align: right; border-bottom: 1px solid var(--border); }
    th { background: #0f172a; color: var(--muted); }
    
    .view-section { display: none; }
    .view-section.active { display: block; }
    .muted { color: var(--muted); font-size: 0.85rem; }
  </style>
</head>
<body>

  <div class="shell">
    <!-- Sidebar -->
    <aside class="sidebar">
      <h2>TapAttend</h2>
      <div class="muted">نظام الحضور والرواتب</div>
      <hr style="border-color: var(--border);" />
      <button class="nav-btn active" onclick="switchTab('dashboard')">لوحة التحكم</button>
      <button class="nav-btn" onclick="switchTab('users')">الموظفون</button>
      <button class="nav-btn" onclick="switchTab('points')">نقاط الحضور</button>
      <button class="nav-btn" onclick="switchTab('logs')">السجلات</button>
      <button class="nav-btn" onclick="switchTab('payroll')">المالية والرواتب</button>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      
      <!-- Dashboard Section -->
      <section id="sec-dashboard" class="view-section active">
        <h1>لوحة التحكم</h1>
        <br />
        <div class="cards-grid">
          <div class="card"><div class="muted">مسح اليوم</div><div class="kpi" id="kpi-scans">0</div></div>
          <div class="card"><div class="muted">الموظفون الحاضرون</div><div class="kpi" id="kpi-present">0</div></div>
          <div class="card"><div class="muted">إجمالي الموظفين</div><div class="kpi" id="kpi-total">0</div></div>
        </div>
      </section>

      <!-- Users Section -->
      <section id="sec-users" class="view-section">
        <h1>إدارة الموظفين</h1>
        <br />
        <form class="card form-card" onsubmit="createUser(event)">
          <input id="u-name" placeholder="اسم الموظف" required />
          <input id="u-email" type="email" placeholder="البريد الإلكتروني" required />
          <input id="u-pass" type="password" placeholder="كلمة المرور" required />
          <select id="u-role">
            <option value="employee">موظف</option>
            <option value="hr">موارد بشرية (HR)</option>
          </select>
          <button class="btn" type="submit">إضافة موظف</button>
        </form>
        <table>
          <thead><tr><th>الاسم</th><th>البريد الإلكتروني</th><th>الدور</th></tr></thead>
          <tbody id="users-table-body"></tbody>
        </table>
      </section>

      <!-- Points Section -->
      <section id="sec-points" class="view-section">
        <h1>نقاط الحضور (QR & NFC)</h1>
        <br />
        <form class="card form-card" onsubmit="createPoint(event)">
          <input id="p-name" placeholder="اسم الموقع" required />
          <input id="p-lat" placeholder="خط العرض (Lat)" />
          <input id="p-lng" placeholder="خط الطول (Lng)" />
          <input id="p-uid" placeholder="NFC UID (اختياري)" />
          <button class="btn" type="submit">إنشاء نقطة</button>
        </form>
        <div id="points-container" class="cards-grid"></div>
      </section>

      <!-- Logs Section -->
      <section id="sec-logs" class="view-section">
        <h1>سجلات الحضور والانصراف</h1>
        <br />
        <table>
          <thead><tr><th>الوقت</th><th>الموظف</th><th>النوع</th><th>الموقع</th></tr></thead>
          <tbody id="logs-table-body"></tbody>
        </table>
      </section>

      <!-- Payroll Section -->
      <section id="sec-payroll" class="view-section">
        <h1>الاستعلام المالي والرواتب</h1>
        <br />
        <div class="card form-card">
          <input id="pay-user-id" placeholder="أدخل معرف الموظف (User ID)" />
          <button class="btn" onclick="fetchPayroll()">استعلام مالى</button>
        </div>
        <div id="payroll-result" class="card" style="display:none;">
          <h3>تفاصيل الراتب</h3>
          <p id="pay-details" style="margin-top: 1rem; line-height: 1.8;"></p>
        </div>
      </section>

    </main>
  </div>

  <script>
    function switchTab(tabName) {
      document.querySelectorAll('.view-section').forEach(s => s.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      
      document.getElementById('sec-' + tabName).classList.add('active');
      event.target.classList.add('active');

      if(tabName === 'dashboard') loadSummary();
      if(tabName === 'users') loadUsers();
      if(tabName === 'points') loadPoints();
      if(tabName === 'logs') loadLogs();
    }

    async function loadSummary() {
      try {
        const res = await fetch('/api/attendance/summary');
        const data = await res.json();
        document.getElementById('kpi-scans').innerText = data.scans_today || 0;
        document.getElementById('kpi-present').innerText = data.present_employees || 0;
        document.getElementById('kpi-total').innerText = data.total_employees || 0;
      } catch(e) {}
    }

    async function loadUsers() {
      try {
        const res = await fetch('/api/users');
        const users = await res.json();
        const body = document.getElementById('users-table-body');
        body.innerHTML = users.map(u => `<tr><td>${u.full_name}</td><td>${u.email}</td><td>${u.role}</td></tr>`).join('');
      } catch(e) {}
    }

    async function createUser(e) {
      e.preventDefault();
      const payload = {
        full_name: document.getElementById('u-name').value,
        email: document.getElementById('u-email').value,
        password: document.getElementById('u-pass').value,
        role: document.getElementById('u-role').value
      };
      await fetch('/api/users', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(payload) });
      loadUsers();
    }

    async function loadPoints() {
      try {
        const res = await fetch('/api/points');
        const points = await res.json();
        const container = document.getElementById('points-container');
        container.innerHTML = points.map(p => `
          <div class="card">
            <strong>${p.location_name}</strong>
            <div class="muted">${p.token_uid || 'NFC غير محدد'}</div>
          </div>
        `).join('');
      } catch(e) {}
    }

    async function createPoint(e) {
      e.preventDefault();
      const payload = {
        location_name: document.getElementById('p-name').value,
        latitude: parseFloat(document.getElementById('p-lat').value) || null,
        longitude: parseFloat(document.getElementById('p-lng').value) || null,
        token_uid: document.getElementById('p-uid').value || null
      };
      await fetch('/api/points', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(payload) });
      loadPoints();
    }

    async function loadLogs() {
      try {
        const res = await fetch('/api/attendance/logs');
        const logs = await res.json();
        const body = document.getElementById('logs-table-body');
        body.innerHTML = logs.map(l => `
          <tr>
            <td>${new Date(l.recorded_at).toLocaleString('ar-EG')}</td>
            <td>${l.user_name || '—'}</td>
            <td>${l.event_type === 'in' ? 'حضور' : 'انصراف'}</td>
            <td>${l.location_name || '—'}</td>
          </tr>
        `).join('');
      } catch(e) {}
    }

    async function fetchPayroll() {
      const uid = document.getElementById('pay-user-id').value;
      if(!uid) return alert('أدخل معرف الموظف أولاً');
      try {
        const res = await fetch(`/api/payroll/${uid}`);
        const data = await res.json();
        document.getElementById('payroll-result').style.display = 'block';
        document.getElementById('pay-details').innerHTML = `
          الموظف ID: ${data.user_id || uid} <br/>
          الأيام المستحقة: ${data.days_worked || 0} يوم <br/>
          صافي الراتب: <strong>${data.salary || 0} ج.م</strong>
        `;
      } catch(e) {
        alert('حدث خطأ أثناء جلب بيانات المالية');
      }
    }

    // Load initial
    loadSummary();
  </script>
</body>
</html>
