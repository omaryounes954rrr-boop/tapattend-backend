<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TapAttend | مستقبل الإدارة المالية</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #111827;
            --accent-cyan: #06b6d4;
            --accent-green: #10b981;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --border-color: #1f2937;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            background-image: radial-gradient(circle at 50% 10%, #1e1b4b 0%, var(--bg-color) 70%);
        }

        .container {
            width: 100%;
            max-width: 800px;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
        }

        header h1 {
            font-size: 2.5rem;
            font-weight: 800;
            background: linear-gradient(45deg, var(--accent-cyan), var(--accent-green));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        header p {
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
            margin-bottom: 25px;
        }

        .search-box {
            display: flex;
            gap: 15px;
        }

        input {
            flex: 1;
            background-color: #1f2937;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 14px 20px;
            color: white;
            font-size: 1rem;
            outline: none;
            transition: 0.3s;
        }

        input:focus {
            border-color: var(--accent-cyan);
            box-shadow: 0 0 10px rgba(6, 182, 212, 0.3);
        }

        button {
            background: linear-gradient(135deg, var(--accent-cyan), #3b82f6);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 0 30px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            opacity: 0.9;
            box-shadow: 0 0 15px rgba(6, 182, 212, 0.5);
        }

        .results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .stat-card {
            background-color: #1f2937;
            border-radius: 12px;
            padding: 20px;
            border-right: 4px solid var(--accent-cyan);
        }

        .stat-card.green { border-right-color: var(--accent-green); }
        .stat-card.purple { border-right-color: #8b5cf6; }

        .stat-title {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 8px;
        }

        .stat-value {
            font-size: 1.5rem;
            font-weight: 700;
            color: white;
        }

        .employee-info {
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
        }

        .employee-info h2 {
            font-size: 1.4rem;
            color: white;
        }

        .employee-info span {
            color: var(--accent-cyan);
            font-size: 0.95rem;
        }

        .hidden { display: none; }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>TapAttend Core</h1>
            <p>نظام إدارة الحضور والرواتب المستقبلي</p>
        </header>

        <!-- بحث عن موظف -->
        <div class="card">
            <div class="search-box">
                <input type="text" id="userIdInput" placeholder="أدخل معرف الموظف (User ID)...">
                <button onclick="fetchPayroll()">استعلام مالي</button>
            </div>
        </div>

        <!-- عرض النتائج -->
        <div id="resultCard" class="card hidden">
            <div class="employee-info">
                <h2 id="empName">اسم الموظف</h2>
                <span id="empEmail">email@company.com</span>
            </div>

            <div class="results-grid">
                <div class="stat-card">
                    <div class="stat-title">ساعات العمل الفعلية</div>
                    <div class="stat-value" id="totalHours">0.0 ساعة</div>
                </div>
                <div class="stat-card purple">
                    <div class="stat-title">أجر الساعة</div>
                    <div class="stat-value" id="hourlyRate">0 ج.م</div>
                </div>
                <div class="stat-card">
                    <div class="stat-title">إجمالي الجزاءات والخصومات</div>
                    <div class="stat-value" id="totalDeductions" style="color: #ef4444;">0 ج.م</div>
                </div>
                <div class="stat-card green">
                    <div class="stat-title">صافي المرتب المستحق</div>
                    <div class="stat-value" id="netSalary">0 ج.م</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        async function fetchPayroll() {
            const userId = document.getElementById('userIdInput').value.trim();
            if (!userId) {
                alert('الرجاء إدخال معرف الموظف أولاً!');
                return;
            }

            try {
                const response = await fetch(`/api/payroll/${userId}`);
                if (!response.ok) {
                    throw new Error('الموظف غير موجود أو حدث خطأ');
                }
                const data = await response.json();

                document.getElementById('empName').innerText = data.employee_name;
                document.getElementById('empEmail').innerText = data.email;
                document.getElementById('totalHours').innerText = data.total_hours_worked + ' ساعة';
                document.getElementById('hourlyRate').innerText = data.hourly_rate + ' ج.م';
                document.getElementById('totalDeductions').innerText = data.total_deductions + ' ج.م';
                document.getElementById('netSalary').innerText = data.net_salary + ' ج.م';

                document.getElementById('resultCard').classList.remove('hidden');
            } catch (error) {
                alert('فشل في جلب البيانات، تأكد من صحة الـ User ID.');
                console.error(error);
            }
        }
    </script>
</body>
</html>
